     Al cambiar cualquiera de estos archivos, subele el numero. -->

<body>
<div id="app"><div class="spin" role="status" aria-label="Cargando"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>

<!-- Para que el portal se actualice solo, tambien desde un icono en la
     pantalla de inicio. Ver sw.js. Si el navegador no lo soporta, el
     portal sigue funcionando igual: solo pierde esa ayuda. -->
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* sin drama */ });
  });
  /* Aqui habia una recarga automatica al entrar una version nueva. Se
     quito: recargar a mitad de sesion corta las peticiones que esten en
     vuelo, y si eso cae justo cuando se esta guardando un documento, el
     PDF se baja y la base nunca se entera. En Safari sale como
     "TypeError: Load failed" y parece un problema de red que no existe.
     La version fresca entra sola en el siguiente arranque, que es lo que
     hacia falta. */
})();
</script>
</body>
</html>
